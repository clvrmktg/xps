{{- define "main" -}}
<div class="[ grid layout--spacing section--padding-top ]">
  <header class="[ grid row-gap--1 ]">
    <div>
      <h1>{{- .Title -}}</h1>
      {{ partial "breadcrumbs.html" . }}
    </div>
    {{- $cat := index site.Data.categories "default" }}
    {{- with $cat }}
    <p class="[ x--700 pb--0 ]">{{ .description }}</p>
    {{- end }}
  </header>
  <ul>
    {{ range .Data.Terms.Alphabetical }}
      <li>
        <a href="{{ partial "category-url.html" .Page.Title }}" data-prefetch>
          {{- partial "category-title.html" .Page.Title -}}
        </a>
      </li>
    {{ end }}
  </ul>
  
</div>

{{- end -}}
